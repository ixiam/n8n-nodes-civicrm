name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint and test
        run: pnpm run lint && pnpm run test:unit

      # No NPM_TOKEN needed: authenticates via OIDC (Trusted Publisher on npmjs.com).
      # Pre-release versions (e.g. 4.0.0-dev.1) go to the "next" tag, never "latest".
      - name: Publish with provenance
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish --provenance --access public --tag "$TAG"
