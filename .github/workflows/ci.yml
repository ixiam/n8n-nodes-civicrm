name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (n8n community-node rules)
        run: pnpm run lint

      - name: Build and test
        # The live CiviCRM suite skips itself without CIVI_IT_URL.
        run: pnpm test
